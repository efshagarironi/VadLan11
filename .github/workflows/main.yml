           // mode 0 = home page background, 1 = settings menu color, 2 = home frame background, 3 = top settings frame
           View bgPageG(final int mode, final int fg) {
            final String pre = mode == 0 ? "bg" : (mode == 1 ? "m" : (mode == 2 ? "hf" : (mode == 3 ? "tb" : "bx")));
            final int req = mode == 0 ? REQ_IMG : (mode == 1 ? REQ_MIMG : (mode == 2 ? REQ_FIMG : REQ_TIMG));
            String title = mode == 0 ? t("پس‌زمینه", "Background")
              : (mode == 1 ? t("رنگ منو", "Menu color")
              : (mode == 2 ? t("پس‌زمینه کادر", "Frame background")
              : (mode == 3 ? t("رنگ کادر تنظیمات", "Settings frame color")
              : (mode == 4 ? t("رنگ کادر اصلی", "Main box color") : mode == 5 ? t("رنگ کادر فرعی", "Secondary box color") : t("پس زمینه کادر عملکرد", "Action box background")))));
            LinearLayout p = vbox();
            p.addView(topBar(title, fg));
            if (mode == 6) p.addView(toggleRowThen(0xFFEC407A, "◐", t("اتومات", "Auto"),
              t("رنگ کادرها و فونت آیکون‌ها برعکس رنگ پس‌زمینه می‌شود (روشن ↔ تیره)", "Boxes and text take the opposite colour of the background (light ↔ dark)"),
              "bub_auto", false, fg, () -> { if (sp.getBoolean("bub_auto", false) && !TileClickService.ready()) BubbleActs.needA11y(this); show(); }));
            if (mode == 6) p.addView(accordionRow(0xFF607D8B, "🌫", t("شفافیت کادر در حالت اتومات", "Box opacity in auto mode"), "bub_auto_alpha", 10, 100, 95, "%", fg, null));
            if (mode == 6) p.addView(toggleRowThen(0xFF8D6E63, "🔤", t("رنگ فونت", "Font color"),
              t("رنگ دلخواه برای نام عملکردها و پوشه‌ها", "Your own colour for the names of actions and folders"),
              "bub_fcol_on", false, fg, () -> show()));
            if (mode == 6 && sp.getBoolean("bub_fcol_on", false)) p.addView(row(0xFF8D6E63, "🎨", t("انتخاب رنگ فونت", "Pick font colour"), null, 0, fg,
              w -> prefColorDialog("bub_fcol", 0xFFFFFFFF, t("رنگ فونت", "Font colour"))));

            boolean hasImg = mode >= 4 ? false : mode == 0 ? bgBmp != null : (mode == 1 ? mbgBmp != null
              : (mode == 2 ? hfSrc != null : tbSrc != null));
            if (mode < 4) p.addView(row(0xFF26A69A, "🖼", t("عکس پس‌زمینه", "Background image"),
              hasImg ? t("فعال", "Active") : t("انتخاب عکس از گالری", "Pick a photo from the gallery"),
              0, fg, v -> pickImg(req)));
            if (hasImg) {
             // changes are applied to the screen when the slider is released
             Runnable rb = () -> imgChanged(mode);
             p.addView(accordionRow(0xFF607D8B, "🌫", t("مات", "Fade"), pre + "Fade", 0, 98, 0, "%", fg, rb));
             p.addView(accordionGroup(0xFF8BC34A, "✂", t("برش و اندازه عکس", "Crop & size"), fg,
               slider(t("اندازه", "Zoom"), pre + "Zoom", 100, 300, 100, "%", fg, rb),
