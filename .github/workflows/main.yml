             tll.setMargins(-dp(12), dp(4), -dp(12), 0);
             root.addView(tl, tll);
             topLineV = tl;
            }
            final boolean dockTop = false;
            LinearLayout.LayoutParams dl = new LinearLayout.LayoutParams(-1, -2);
            dl.setMargins(0, dp(4), 0, dp(4));

            LinearLayout dockBox = new LinearLayout(this);
            dockBoxV = dockBox;
