name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/mylauncher app/src/main/res/drawable app/src/main/res/xml app/src/main/res/values app/src/main/res/mipmap-anydpi-v26 app/src/main/assets/fonts/fa app/src/main/assets/fonts/en

          dl() { curl -fsSL --retry 2 --max-time 90 -o "app/src/main/assets/fonts/$1" "$2" || rm -f "app/src/main/assets/fonts/$1"; }
          G=https://github.com/google/fonts/raw/main/ofl
          R=https://github.com/rastikerdar
          dl fa/Vazirmatn-VF.ttf "$G/vazirmatn/Vazirmatn%5Bwght%5D.ttf"
          dl fa/Nastaliq_Noto-VF.ttf "$G/notonastaliqurdu/NotoNastaliqUrdu%5Bwght%5D.ttf"
          dl fa/Naskh_Noto-VF.ttf "$G/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf"
          dl fa/Amiri.ttf "$G/amiri/Amiri-Regular.ttf"
          dl fa/Lateef.ttf "$G/lateef/Lateef-Regular.ttf"
          dl fa/Scheherazade_New.ttf "$G/scheherazadenew/ScheherazadeNew-Regular.ttf"
          dl fa/Lalezar.ttf "$G/lalezar/Lalezar-Regular.ttf"
          dl fa/Tajawal.ttf "$G/tajawal/Tajawal-Regular.ttf"
          dl fa/Almarai.ttf "$G/almarai/Almarai-Regular.ttf"
          dl fa/Mirza.ttf "$G/mirza/Mirza-Regular.ttf"
          dl fa/Harmattan.ttf "$G/harmattan/Harmattan-Regular.ttf"
          dl fa/Aref_Ruqaa.ttf "$G/arefruqaa/ArefRuqaa-Regular.ttf"
          dl fa/Katibeh.ttf "$G/katibeh/Katibeh-Regular.ttf"
          dl fa/Markazi_Text-VF.ttf "$G/markazitext/MarkaziText%5Bwght%5D.ttf"
          dl fa/El_Messiri-VF.ttf "$G/elmessiri/ElMessiri%5Bwght%5D.ttf"
          dl fa/Reem_Kufi-VF.ttf "$G/reemkufi/ReemKufi%5Bwght%5D.ttf"
          dl fa/Changa-VF.ttf "$G/changa/Changa%5Bwght%5D.ttf"
          dl fa/Jomhuria.ttf "$G/jomhuria/Jomhuria-Regular.ttf"
          dl fa/Rakkas.ttf "$G/rakkas/Rakkas-Regular.ttf"
          dl fa/Lemonada-VF.ttf "$G/lemonada/Lemonada%5Bwght%5D.ttf"
          dl fa/Baloo_Bhaijaan_2-VF.ttf "$G/baloobhaijaan2/BalooBhaijaan2%5Bwght%5D.ttf"
          dl fa/Mada-VF.ttf "$G/mada/Mada%5Bwght%5D.ttf"
          dl fa/Sahel.ttf "$R/sahel-font/raw/master/dist/Sahel.ttf"
          dl fa/Shabnam.ttf "$R/shabnam-font/raw/master/dist/Shabnam.ttf"
          dl fa/Samim.ttf "$R/samim-font/raw/master/dist/Samim.ttf"
          dl fa/Tanha.ttf "$R/tanha-font/raw/master/dist/Tanha.ttf"
          dl fa/Parastoo.ttf "$R/parastoo-font/raw/master/dist/Parastoo.ttf"
          dl fa/Gandom.ttf "$R/gandom-font/raw/master/dist/Gandom.ttf"
          dl fa/Nahid.ttf "$R/nahid-font/raw/master/dist/Nahid.ttf"
          dl fa/Vazir.ttf "$R/vazir-font/raw/master/dist/Vazir.ttf"
          dl en/Roboto-VF.ttf "$G/roboto/Roboto%5Bwdth%2Cwght%5D.ttf"
          dl en/Open_Sans-VF.ttf "$G/opensans/OpenSans%5Bwdth%2Cwght%5D.ttf"
          dl en/Montserrat-VF.ttf "$G/montserrat/Montserrat%5Bwght%5D.ttf"
          dl en/Oswald-VF.ttf "$G/oswald/Oswald%5Bwght%5D.ttf"
          dl en/Playfair_Display-VF.ttf "$G/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf"
          dl en/Dancing_Script-VF.ttf "$G/dancingscript/DancingScript%5Bwght%5D.ttf"
          dl en/Caveat-VF.ttf "$G/caveat/Caveat%5Bwght%5D.ttf"
          dl en/Orbitron-VF.ttf "$G/orbitron/Orbitron%5Bwght%5D.ttf"
          dl en/Lobster.ttf "$G/lobster/Lobster-Regular.ttf"
          dl en/Pacifico.ttf "$G/pacifico/Pacifico-Regular.ttf"
          dl en/Bebas_Neue.ttf "$G/bebasneue/BebasNeue-Regular.ttf"
          dl en/Poppins.ttf "$G/poppins/Poppins-Regular.ttf"
          dl en/Lato.ttf "$G/lato/Lato-Regular.ttf"
          dl en/Righteous.ttf "$G/righteous/Righteous-Regular.ttf"
          dl en/Press_Start_2P.ttf "$G/pressstart2p/PressStart2P-Regular.ttf"

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "VadLan"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          # fixed signing key: every build is signed with the same key, so a new APK installs over the old one
          echo "" | base64 -d > app/vadlan.jks

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.mylauncher'
              compileSdk 34
              signingConfigs {
                  vadlan {
                      storeFile file('vadlan.jks')
                      storePassword 'vadlan123'
                      keyAlias 'vadlan'
                      keyPassword 'vadlan123'
                  }
              }
              defaultConfig {
                  applicationId "com.vadlan"
                  minSdk 26
                  targetSdk 34
                  // minutes since 1970: always bigger than the previous build, so Android never sees it as a downgrade
                  versionCode System.currentTimeMillis().intdiv(60000L).intValue()
                  versionName "47.0"
              }
              buildTypes {
                  debug { signingConfig signingConfigs.vadlan }
                  release { signingConfig signingConfigs.vadlan }
              }
          }
          tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
