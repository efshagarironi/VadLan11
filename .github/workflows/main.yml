           void styleHexField(EditText et, int fg) {
            et.setHintTextColor(0x88888888);
            et.setTextColor(fg);
            et.setSingleLine(true);
            et.setPadding(dp(14), dp(10), dp(14), dp(10));
            et.setBackground(boxBg(light() ? 0x14000000 : 0x1AFFFFFF, BOX_R));
