            r.id = raw != null ? raw : sp.getString("swl_" + d, "[]");
            return r;
           }

           static void swipeRootSave(SharedPreferences sp, String d, Act r) {
            sp.edit().putString("swf_" + d, r.id == null ? "[]" : r.id).apply();
