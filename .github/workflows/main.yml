              void actSlotClick(final int slot) {
                  final BubbleActs.Act[] acts = BubbleActs.load(sp);
                  final BubbleActs.Act a = acts[slot];
                  if (a == null) {
                      actPickApp(slot);
                      return;
                  }
                  CharSequence[] items = {
                          t("انتخاب به‌عنوان آخرین عملکرد این برنامه", "Use as this app's last action"),
                          t("تغییر عملکرد", "Change action"),
                          t("حذف", "Delete")};
                  new AlertDialog.Builder(this).setTitle((slot + 1) + ". " + BubbleActs.appLabel(this, a.pkg))
                          .setItems(items, (d, w) -> {
                              if (w == 0) {
                                  a.ts = System.currentTimeMillis();
                                  BubbleActs.save(sp, acts);
                                  show();
                              } else if (w == 1) {
                                  actPickApp(slot);
                              } else {
                                  acts[slot] = null;
                                  BubbleActs.save(sp, acts);
                                  if (!BubbleActs.pkgs(acts).contains(a.pkg)) sp.edit().remove("bub_on_" + a.pkg).apply();
                                  show();
                              }
                          }).setNegativeButton(t("لغو", "Cancel"), null).show();
              }

              // step 1: which app
              void actPickApp(final int slot) {
                  PackageManager pm = getPackageManager();
                  Intent q = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER);
                  Set<String> seen = new HashSet<>();
                  final List<String[]> l = new ArrayList<>();
                  for (ResolveInfo ri : pm.queryIntentActivities(q, 0)) {
                      String p = ri.activityInfo.packageName;
                      if (p.equals(getPackageName()) || !seen.add(p)) continue;
                      l.add(new String[]{ri.loadLabel(pm).toString(), p});
                  }
                  Collections.sort(l, (x, y) -> x[0].compareToIgnoreCase(y[0]));
                  CharSequence[] names = new CharSequence[l.size()];
                  for (int i = 0; i < names.length; i++) names[i] = l.get(i)[0];
                  new AlertDialog.Builder(this).setTitle(t("انتخاب برنامه", "Choose app"))
                          .setItems(names, (d, w) -> actPickMode(slot, l.get(w)[1], l.get(w)[0]))
                          .setNegativeButton(t("لغو", "Cancel"), null).show();
              }

              // step 2: make an action of the app, or just open the app itself
              // opening the app itself: as a popup (the size of "Run apps"), or full
              void actPickOpen(final int slot, final String pkg, final String appName) {
                  CharSequence[] items = {
                          t("🗗 باز شدن در پاپ آپ", "🗗 Open in a popup"),
                          t("⛶ باز شدن کامل", "⛶ Open full")};
                  new AlertDialog.Builder(this).setTitle(appName).setItems(items, (d, w) -> {
                      if (w == 0) actSave(slot, pkg, "app", "popup", t("باز شدن در پاپ آپ", "Open in popup"));
                      else actSave(slot, pkg, "app", "full", t("باز شدن کامل", "Open full"));
                  }).setNegativeButton(t("بازگشت", "Back"), (d, w) -> actPickMode(slot, pkg, appName)).show();
              }

              void actPickMode(final int slot, final String pkg, final String appName) {
                  CharSequence[] items = {
                          t("⚙ ایجاد عملکرد برنامه (بدون باز شدن برنامه)", "⚙ Create an app action (the app does not open)"),
                          t("📂 باز کردن خود برنامه (بدون اجرای عملکرد)", "📂 Open the app itself (no action)")};
                  new AlertDialog.Builder(this).setTitle(appName).setItems(items, (d, w) -> {
                      if (w == 0) actPickKind(slot, pkg, appName);
                      else actPickOpen(slot, pkg, appName);
                  }).setNegativeButton(t("لغو", "Cancel"), null).show();
              }

              // step 3: one of the app's shortcuts, a part of the app, a quick settings tile, or save the app's last run
              void actPickKind(final int slot, final String pkg, final String appName) {
                  final List<ShortcutInfo> scs = BubbleActs.shortcuts(this, pkg);
                  CharSequence[] items = new CharSequence[scs.size() + 3];
                  for (int i = 0; i < scs.size(); i++) {
                      CharSequence sl = scs.get(i).getShortLabel();
                      items[i] = "⚡ " + (sl == null ? scs.get(i).getId() : sl);
                  }
                  items[scs.size()] = t("🧩 بخش‌های برنامه (Activity / Receiver / Service)", "🧩 App parts (Activity / Receiver / Service)");
                  items[scs.size() + 1] = t("🔲 کاشی تنظیمات سریع (پنل بالای صفحه)", "🔲 Quick Settings tile");
                  items[scs.size() + 2] = t("▶ باز کردن برنامه و ثبت آخرین اجرا", "▶ Open the app and save its last run");
                  new AlertDialog.Builder(this).setTitle(appName).setItems(items, (d, w) -> {
                      if (w == scs.size() + 2) {
                          actRecordByOpening(slot, pkg);
                      } else if (w == scs.size() + 1) {
                          actPickTile(slot, pkg, appName);
                      } else if (w == scs.size()) {
                          actPickPart(slot, pkg, appName);
                      } else {
                          ShortcutInfo s = scs.get(w);
                          CharSequence sl = s.getShortLabel();
                          actSave(slot, pkg, "sc", s.getId(), sl == null ? s.getId() : sl.toString());
                      }
                  }).setNegativeButton(t("لغو", "Cancel"), null).show();
              }

              // a Quick Settings tile: the name written on the tile is typed here
              void actPickTile(final int slot, final String pkg, String appName) {
                  final EditText et = new EditText(this);
                  et.setSingleLine(true);
                  et.setText(appName);
                  et.setSelection(appName.length());
                  FrameLayout fl = new FrameLayout(this);
                  fl.setPadding(dp(20), dp(8), dp(20), 0);
                  fl.addView(et, new FrameLayout.LayoutParams(-1, -2));
                  new AlertDialog.Builder(this).setTitle(t("نام کاشی", "Tile name"))
                          .setMessage(t("نامی که روی کاشی در پنل تنظیمات سریع نوشته شده است را وارد کنید.",
                                  "Type the name written on the tile in the Quick Settings panel."))
                          .setView(fl)
                          .setPositiveButton(t("ثبت", "Save"), (d, w) -> {
                              String nm = et.getText().toString().trim();
                              if (nm.isEmpty()) return;
                              actSave(slot, pkg, "tile", nm, "🔲 " + nm);
                              if (!TileClickService.ready()) {
                                  new AlertDialog.Builder(this).setTitle(t("دسترسی‌پذیری", "Accessibility"))
                                          .setMessage(t("برای کلیک روی کاشی باید سرویس دسترسی‌پذیری VadLan را در تنظیمات گوشی روشن کنید.",
                                                  "To tap the tile, turn on the VadLan accessibility service in the phone settings."))
                                          .setPositiveButton(t("باز کردن تنظیمات", "Open settings"), (d2, w2) -> {
                                              try { startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)); } catch (Exception e) { }
                                          })
                                          .setNegativeButton(t("بعداً", "Later"), null).show();
                              }
                          })
                          .setNegativeButton(t("لغو", "Cancel"), null).show();
              }

              // optional: a screen, receiver or service of the app that runs without opening the app itself
              void actPickPart(final int slot, final String pkg, final String appName) {
                  final List<String[]> parts = BubbleActs.components(this, pkg);
                  if (parts.isEmpty()) {
                      Toast.makeText(this, t("این برنامه بخش قابل اجرایی ندارد", "This app has no startable parts"), Toast.LENGTH_SHORT).show();
                      actPickKind(slot, pkg, appName);
                      return;
                  }
                  CharSequence[] names = new CharSequence[parts.size()];
                  for (int i = 0; i < names.length; i++) names[i] = parts.get(i)[2];
                  new AlertDialog.Builder(this).setTitle(appName)
                          .setItems(names, (d, w) -> {
                              String[] p = parts.get(w);
                              actSave(slot, pkg, p[0], p[1], p[2]);
                          })
                          .setNegativeButton(t("بازگشت", "Back"), (d, w) -> actPickKind(slot, pkg, appName)).show();
              }

              void actSave(int slot, String pkg, String type, String id, String label) {
                  BubbleActs.Act[] acts = BubbleActs.load(sp);
                  BubbleActs.Act a = new BubbleActs.Act();
                  a.pkg = pkg;
                  a.type = type;
                  a.id = id;
                  a.label = label;
                  a.ts = System.currentTimeMillis();
                  acts[slot] = a;
                  BubbleActs.save(sp, acts);
                  page = ACTS;
                  show();
              }

              // the app is opened now; when the person comes back to the launcher its last screen is saved
              void actRecordByOpening(final int slot, final String pkg) {
                  final Intent li = getPackageManager().getLaunchIntentForPackage(pkg);
                  if (li == null) {
                      Toast.makeText(this, t("این برنامه قابل اجرا نیست", "This app cannot be opened"), Toast.LENGTH_SHORT).show();
                      return;
                  }
                  if (!BubbleActs.hasUsage(this)) {
                      new AlertDialog.Builder(this).setTitle(t("دسترسی لازم است", "Permission needed"))
                              .setMessage(t("برای ثبت آخرین اجرای برنامه، دسترسی «Usage access» را برای VadLan فعال کنید و دوباره تلاش کنید. یا فقط باز کردن ساده برنامه را ثبت کنید.",
                                      "To save the app's last run, allow \"Usage access\" for VadLan and try again. Or save just a plain open of the app."))
                              .setPositiveButton(t("اعطای دسترسی", "Grant"), (d, w) -> {
                                  try { startActivity(new Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS)); } catch (Exception e) { }
                              })
                              .setNeutralButton(t("فقط باز کردن برنامه", "Just open the app"),
                                      (d, w) -> actSave(slot, pkg, "app", "", t("باز کردن برنامه", "Open app")))
                              .setNegativeButton(t("لغو", "Cancel"), null).show();
                      return;
                  }
                  sp.edit().putInt("bub_pend_slot", slot).putString("bub_pend_pkg", pkg)
                          .putLong("bub_pend_t", System.currentTimeMillis()).apply();
                  Toast.makeText(this, t("برنامه را اجرا کنید و کارتان را انجام دهید، سپس به لانچر برگردید",
                          "Use the app, then come back to the launcher"), Toast.LENGTH_LONG).show();
                  startActivity(li);
              }

              // back in the launcher after "open the app and save its last run"
              void finishPendingAct() {
                  String pkg = sp.getString("bub_pend_pkg", null);
                  if (pkg == null) return;
                  int slot = sp.getInt("bub_pend_slot", -1);
                  long since = sp.getLong("bub_pend_t", 0);
                  sp.edit().remove("bub_pend_pkg").remove("bub_pend_slot").remove("bub_pend_t").apply();
                  if (slot < 0 || slot >= BubbleActs.MAX) return;
                  String cls = BubbleActs.lastScreen(this, pkg, since);
                  if (cls != null) {
                      actSave(slot, pkg, "cmp", cls, cls.substring(cls.lastIndexOf('.') + 1));
                      if (cls.equals(BubbleActs.mainScreen(this, pkg)))
                          Toast.makeText(this, t("این صفحه اصلی برنامه است و اجرای آن فقط برنامه را باز می‌کند؛ بهتر است میان‌بر یا بخشی از برنامه را انتخاب کنید",
                                  "This is the app's main screen; running it only opens the app. Better pick a shortcut or an app part"), Toast.LENGTH_LONG).show();
                      else
                          Toast.makeText(this, t("آخرین اجرای برنامه ثبت شد", "The app's last run was saved"), Toast.LENGTH_SHORT).show();
                  } else {
                      actSave(slot, pkg, "app", "", t("باز کردن برنامه", "Open app"));
                      Toast.makeText(this, t("آخرین اجرا پیدا نشد؛ باز کردن ساده ثبت شد", "Last run not found; a plain open was saved"), Toast.LENGTH_SHORT).show();
                  }
              }

              void setTile(boolean on) {
                  ComponentName cn = new ComponentName(this, VadTile.class);
                  getPackageManager().setComponentEnabledSetting(cn,
                          on ? PackageManager.COMPONENT_ENABLED_STATE_ENABLED
                                  : PackageManager.COMPONENT_ENABLED_STATE_DISABLED,
                          PackageManager.DONT_KILL_APP);
                  sp.edit().putBoolean("tile", on).commit();
                  if (on) {
                      final String manual = t("پنل تنظیمات سریع را باز کنید، ویرایش را بزنید و Vad را اضافه کنید.",
                              "Open Quick Settings, tap edit and add Vad.");
                      if (Build.VERSION.SDK_INT >= 33) {
                          container.postDelayed(() -> {
                              try {
                                  StatusBarManager sbm = (StatusBarManager) getSystemService("statusbar");
                                  sbm.requestAddTileService(new ComponentName(this, VadTile.class), "Vad",
                                          Icon.createWithResource(this, R.drawable.ic_tile),
                                          getMainExecutor(), r -> { });
                              } catch (Exception e) {
                                  Toast.makeText(this, manual, Toast.LENGTH_LONG).show();
                              }
                          }, 600);
                      } else {
                          Toast.makeText(this, manual, Toast.LENGTH_LONG).show();
                      }
                  }
                  show();
              }

              // ---------- background pages ----------
              // the main Background option only changes the home page
              View bgPage(final int fg) { return bgPageG(0, fg); }

              // mode 0 = home page, 1 = settings menu, 2 = home frame, 3 = top settings frame
              int curColor(int mode) {
                  if (mode == 4) return sp.contains("boxMain") ? sp.getInt("boxMain", 0) : (glass() ? (light() ? 0x44FFFFFF : 0x26FFFFFF) : (light() ? 0x14000000 : 0x1AFFFFFF));
                  if (mode == 5) return sp.contains("boxSub") ? sp.getInt("boxSub", 0)
                          : scaleA(glass() ? (light() ? 0x44FFFFFF : 0x26FFFFFF) : (light() ? 0x14000000 : 0x1AFFFFFF), 0.6f);
                  if (mode == 6) return sp.getInt("bub_lcol", 0xF2202024);
                  return mode == 0 ? bg : (mode == 1 ? mbg()
                          : (mode == 2 ? sp.getInt("hfBg", 0x6628282C) : sp.getInt("topBoxBg", 0x6628282C)));
              }

              // a picture setting changed (slider released)
              void imgChanged(int mode) {
                  if (mode == 0) {
                      renderBg();
                      applyWindowBg();
                  } else if (mode == 1) {
                      mbgBmp = renderImg(mbgSrc, "m", mbg());
                      View cv = container.getChildAt(container.getChildCount() - 1);
                      if (cv != null) cv.setBackground(menuBgDrawable());
                  }
              }

              void setColorG(int mode, int c) {
                  if (mode == 0) {
                      setBg(c);
                      return;
                  }
                  if (mode >= 4) {
                      sp.edit().putInt(mode == 4 ? "boxMain" : mode == 5 ? "boxSub" : "bub_lcol", c).apply();
                      show();
                      return;
                  }
                  if (mode == 1) {
                      sp.edit().putInt("mBg", c).putBoolean("mImg", false).apply();
                      mbgSrc = null;
                      mbgBmp = null;
                  } else if (mode == 2) {
                      sp.edit().putInt("hfBg", c).putBoolean("hfImg", false).apply();
                      hfSrc = null;
                  } else {
                      sp.edit().putInt("topBoxBg", c).putBoolean("tbImg", false).apply();
                      tbSrc = null;
                  }
                  show();
              }

              void removeImgG(int mode) {
                  if (mode == 0) {
                      removeBgImage();
                  } else if (mode == 1) {
                      sp.edit().putBoolean("mImg", false).apply();
                      mbgSrc = null;
                      mbgBmp = null;
                      show();
                  } else if (mode == 2) {
                      sp.edit().putBoolean("hfImg", false).apply();
                      hfSrc = null;
                      show();
                  } else {
                      sp.edit().putBoolean("tbImg", false).apply();
                      tbSrc = null;
                      show();
                  }
              }

              // the hex code field sits in a box like the other options
              void styleHexField(EditText et, int fg) {
                  et.setHintTextColor(0x88888888);
                  et.setTextColor(fg);
                  et.setSingleLine(true);
                  et.setPadding(dp(14), dp(10), dp(14), dp(10));
                  et.setBackground(boxBg(light() ? 0x14000000 : 0x1AFFFFFF, BOX_R));
              }

              // mode 0 = home page background, 1 = settings menu color, 2 = home frame background, 3 = top settings frame
              View bgPageG(final int mode, final int fg) {
                  final String pre = mode == 0 ? "bg" : (mode == 1 ? "m" : (mode == 2 ? "hf" : (mode == 3 ? "tb" : "bx")));
                  final int req = mode == 0 ? REQ_IMG : (mode == 1 ? REQ_MIMG : (mode == 2 ? REQ_FIMG : REQ_TIMG));
                  String title = mode == 0 ? t("پس‌زمینه", "Background")
                          : (mode == 1 ? t("رنگ منو", "Menu color")
                          : (mode == 2 ? t("پس‌زمینه کادر", "Frame background")
                          : (mode == 3 ? t("رنگ کادر تنظیمات", "Settings frame color")
                          : (mode == 4 ? t("رنگ کادر اصلی", "Main box color") : mode == 5 ? t("رنگ کادر فرعی", "Secondary box color") : t("رنگ لیست عملکرد", "Action list color")))));
                  LinearLayout p = vbox();
                  p.addView(topBar(title, fg));

                  boolean hasImg = mode >= 4 ? false : mode == 0 ? bgBmp != null : (mode == 1 ? mbgBmp != null
                          : (mode == 2 ? hfSrc != null : tbSrc != null));
                  if (mode < 4) p.addView(row(0xFF26A69A, "🖼", t("عکس پس‌زمینه", "Background image"),
                          hasImg ? t("فعال", "Active") : t("انتخاب عکس از گالری", "Pick a photo from the gallery"),
                          0, fg, v -> pickImg(req)));
                  if (hasImg) {
                      // changes are applied to the screen when the slider is released
                      Runnable rb = () -> imgChanged(mode);
                      p.addView(accordionRow(0xFF607D8B, "🌫", t("مات", "Fade"), pre + "Fade", 0, 98, 0, "%", fg, rb));
                      p.addView(accordionGroup(0xFF8BC34A, "✂", t("برش و اندازه عکس", "Crop & size"), fg,
                              slider(t("اندازه", "Zoom"), pre + "Zoom", 100, 300, 100, "%", fg, rb),
                              slider(t("جابه‌جایی افقی", "Horizontal"), pre + "Px", 0, 100, 50, "%", fg, rb),
                              slider(t("جابه‌جایی عمودی", "Vertical"), pre + "Py", 0, 100, 50, "%", fg, rb)));
                      p.addView(row(0xFFE53935, "✕", t("حذف عکس", "Remove image"), null, 0, fg,
                              v -> removeImgG(mode)));
                  }

                  p.addView(labelBox(t("رنگ پس‌زمینه:", "Background color:"), fg));
                  HorizontalScrollView hs = new HorizontalScrollView(this);
                  hs.setHorizontalScrollBarEnabled(false);
                  LinearLayout r = new LinearLayout(this);
                  final ColorPicker cp = new ColorPicker(this);
                  final EditText et = new EditText(this);
                  for (final int c : colors) {
                      View sw = new View(this);
                      GradientDrawable g = oval(c);
                      g.setStroke(dp(2), 0x88888888);
                      sw.setBackground(g);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(44), dp(44));
                      lp.setMargins(dp(6), dp(8), dp(6), dp(8));
                      sw.setLayoutParams(lp);
                      sw.setOnClickListener(v -> setColorG(mode, c));
                      r.addView(sw);
                  }
                  hs.addView(r);
                  p.addView(hs);

                  p.addView(labelBox(t("انتخاب دلخواه (رنگ و شفافیت):", "Custom color (with transparency):"), fg));
                  cp.setColor(curColor(mode));
                  cp.setListener(c -> et.setText(hex(c)));
                  LinearLayout.LayoutParams cpl = new LinearLayout.LayoutParams(-1, -2);
                  cpl.topMargin = dp(8);
                  p.addView(cp, cpl);

                  LinearLayout r2 = new LinearLayout(this);
                  r2.setGravity(Gravity.CENTER_VERTICAL);
                  et.setText(hex(curColor(mode)));
                  styleHexField(et, fg);
                  LinearLayout.LayoutParams el = new LinearLayout.LayoutParams(0, -2, 2);
                  el.setMargins(0, dp(8), dp(4), dp(4));
                  et.setLayoutParams(el);
                  r2.addView(et);
                  r2.addView(btn(t("اعمال", "Apply"), fg, v -> {
                      try { setColorG(mode, Color.parseColor(et.getText().toString().trim())); }
                      catch (Exception e) {
                          Toast.makeText(this, t("کد رنگ نامعتبر است", "Invalid color code"),
                                  Toast.LENGTH_SHORT).show();
                      }
                  }));
                  p.addView(r2);
                  return wrapScroll(p);
              }

              void setBg(int c) {
                  bg = c;
                  bgBmp = null;
                  bgSrc = null;
                  sp.edit().putInt("bg", bg).putBoolean("bgImg", false).apply();
                  applyWindowBg();
                  show();
              }

