           }

           static List<Act> kids(Act f) {
            List<Act> out = new ArrayList<>();
            if (f == null || f.id == null || f.id.isEmpty()) return out;
            try {
             JSONArray arr = new JSONArray(f.id);
             for (int i = 0; i < arr.length() && out.size() < FMAX; i++) {
              Act k = fromJson(arr.optJSONObject(i));
              if (k != null) out.add(k);
             }
            } catch (Exception e) { }
            return out;
           }

           static void setKids(Act f, List<Act> kids) {
            JSONArray arr = new JSONArray();
            try {
             for (Act k : kids) arr.put(toJson(k));
            } catch (Exception e) { }
            f.id = arr.toString();
           }

           static Act folder(String name) {
            Act f = new Act();
            f.pkg = ""; f.type = "folder"; f.id = "[]"; f.name = name; f.ts = System.currentTimeMillis();
            return f;
           }

           interface KidsOp { void run(List<Act> kids); }

           static boolean edit(Act f, int[] path, int depth, KidsOp op) {
            List<Act> kids = kids(f);
            if (depth == path.length) { op.run(kids); setKids(f, kids); return true; }
            int i = path[depth];
            if (i < 0 || i >= kids.size() || !isFolder(kids.get(i))) return false;
            if (!edit(kids.get(i), path, depth + 1, op)) return false;
            setKids(f, kids);
            return true;
           }

           static Act folderAt(Act root, int[] path) {
            Act cur = root;
            for (int i : path) {
             List<Act> k = kids(cur);
             if (i < 0 || i >= k.size() || !isFolder(k.get(i))) return cur;
             cur = k.get(i);
            }
            return cur;
           }

