              paint.setStrokeWidth(st);
              paint.setShader(new LinearGradient(cx - R, cy - R, cx + R, cy + R,
                new int[]{0x66FFFFFF, 0x00FFFFFF, 0x00000000, 0x66000000},
                new float[]{0f, 0.4f, 0.6f, 1f}, Shader.TileMode.CLAMP));
