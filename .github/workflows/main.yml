              public void setColor(int c) {
                  float[] hsv = new float[3];
                  Color.colorToHSV(c, hsv);
                  h = hsv[0];
                  s = hsv[1];
                  v = hsv[2];
                  a = Color.alpha(c);
                  invalidate();
              }

              public int getColor() { return Color.HSVToColor(a, new float[]{h, s, v}); }

              float dp(float x) { return x * getResources().getDisplayMetrics().density; }

