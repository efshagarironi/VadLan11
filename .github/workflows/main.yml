            o.put("pkg", x.pkg == null ? "" : x.pkg);
            o.put("type", x.type == null ? "app" : x.type);
            o.put("id", x.id == null ? "" : x.id);
            o.put("label", x.label == null ? "" : x.label);
            o.put("name", x.name == null ? "" : x.name);
            o.put("ts", x.ts);
