                  if (mode == 0) {
                      s = clamp(x / side);
                      v = 1 - clamp(y / side);
                  } else if (mode == 1) {
                      h = clamp(y / side) * 359.99f;
                  } else {
                      a = (int) (clamp(x / w) * 255);
                  }
                  invalidate();
                  if (l != null) l.onColor(getColor());
                  return true;
              }
          }
